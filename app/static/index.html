<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Private translation</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Private · Local models</p>
          <h1>Translation workbench</h1>
          <p class="intro">Short-message translation between English, Russian, Mandarin and Korean.</p>
        </div>
        <div class="privacy-mark" title="Message contents are not logged">
          <span class="privacy-dot"></span>
          No message logging
        </div>
      </header>

      <form id="translation-form" class="translator">
        <div class="language-bar">
          <label>
            <span>From</span>
            <select id="source" name="source">
              <option value="english">English</option>
              <option value="russian">Russian</option>
              <option value="mandarin">Mandarin · 简体中文</option>
              <option value="korean">Korean · 한국어</option>
            </select>
          </label>

          <button id="swap" class="swap" type="button" aria-label="Swap source and destination languages">⇄</button>

          <label>
            <span>To</span>
            <select id="dest" name="dest"></select>
          </label>

          <label class="model-choice">
            <span>Model set</span>
            <select id="modelset" name="modelset">
              <option value="default">Default</option>
              <option value="translategemma_4b_q4">TranslateGemma 4B Q4</option>
            </select>
          </label>
        </div>

        <section class="panes">
          <div class="pane input-pane">
            <div class="pane-heading">
              <label for="corpus">Message</label>
              <span><strong id="character-count">0</strong> / 2,000</span>
            </div>
            <textarea id="corpus" name="corpus" maxlength="2000" required placeholder="Type or paste a message…" autofocus></textarea>
          </div>

          <div class="pane output-pane" aria-live="polite">
            <div class="pane-heading">
              <span>Translation</span>
              <button id="copy" class="text-button" type="button" disabled>Copy</button>
            </div>
            <div id="translation" class="translation empty">Your translation will appear here.</div>
          </div>
        </section>

        <div class="actions">
          <button id="translate" class="primary" type="submit">Translate message</button>
          <div id="status" class="status" role="status"></div>
        </div>
      </form>

      <footer>
        <p>Experimental machine translation. Check names, numbers and safety-critical wording before use.</p>
        <p id="model-details"></p>
      </footer>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
