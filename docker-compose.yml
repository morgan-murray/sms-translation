name: translation-embedded

services:
  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      TRANSLATEGEMMA_ENDPOINT: http://translategemma:8080
    ports:
      - "127.0.0.1:${TRANSLATION_PORT:-8001}:8000"
    networks: [backend, edge]
    depends_on: [translategemma]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  translategemma:
    image: ghcr.io/ggml-org/llama.cpp@sha256:991cf50e9eb7dee4c18090849c7f909bafc5a1884cdde2dc3011df7407da09d6
    command: ["--model", "/models/gguf/translategemma-4b-it.Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080", "--threads", "8", "--ctx-size", "4096", "--parallel", "1", "--no-jinja"]
    volumes:
      - ${MODEL_DIRECTORY:-./models}:/models:ro
    networks: [backend]
    restart: unless-stopped

  model-preparer:
    build:
      context: .
      target: runtime
    command: ["python", "scripts/prepare_models.py"]
    environment:
      MODEL_ROOT: /models
      MODEL_MANIFEST: /srv/translation/model-manifest.json
    user: "${MODEL_PREPARER_UID:-1000}:${MODEL_PREPARER_GID:-1000}"
    volumes:
      - ${MODEL_DIRECTORY:-./models}:/models
    profiles: [tools]

networks:
  backend:
    internal: true
  edge: {}
